# Nginx front for the Farmedia PHP app. Document root: php/public.
# docker/start.sh fills in __PORT__, the project path and the security-header snippet path.
# Full configuration (events + http), so it can be run with nginx -c.

pid /tmp/farmedia-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;

    # Writable without root (Procfile hosts run the container as an ordinary user).
    client_body_temp_path /tmp/farmedia-client-body;
    fastcgi_temp_path /tmp/farmedia-fastcgi;

    server {
        listen __PORT__;
        server_name _;

        root /var/www/farmedia/php/public;
        index index.html;

        # The largest API body is 16 KB (php/src/Api.php). Anything bigger is refused here.
        client_max_body_size 32k;

        # Never serve dotfiles (.env, .git, ...).
        location ~ /\. {
            deny all;
            access_log off;
        }

        # Web UI.
        location = / {
            include /etc/nginx/farmedia-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # Static UI files: revalidated on every use, so edits show at once.
        location /static/ {
            include /etc/nginx/farmedia-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # API: every endpoint is a PHP file under php/public/api (e.g. /api/auth/login.php).
        location ~ ^/api/.+\.php$ {
            include /etc/nginx/farmedia-security-headers.conf;
            add_header Cache-Control "no-store" always;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 90s;   # the market search can wait on Overpass mirrors
        }

        # Any other PHP file is not reachable from the web.
        location ~ \.php$ {
            return 404;
        }

        location / {
            include /etc/nginx/farmedia-security-headers.conf;
            try_files $uri $uri/ =404;
        }
    }
}
