; Production settings for the Farmedia PHP app (copied into PHP's conf.d by the Dockerfile).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC
memory_limit = 128M
max_execution_time = 90
post_max_size = 32K
upload_max_filesize = 1M
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
