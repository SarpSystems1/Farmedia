# Security headers, included in every location block of nginx.conf. (nginx drops the server-level
# add_header once a location sets its own, so they are included, not inherited.)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
# HSTS is only honoured over HTTPS; the proxy in front should redirect HTTP to HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
